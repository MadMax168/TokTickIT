services:
  postgres:
    image: postgres:16-alpine
    container_name: tocktickit-postgres
    environment:
      POSTGRES_DB: tocktickit
      POSTGRES_USER: tocktickit
      POSTGRES_PASSWORD: tocktickit
    ports:
      - "5432:5432"
    volumes:
      - tocktickit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tocktickit -d tocktickit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tocktickit-postgres-data:
