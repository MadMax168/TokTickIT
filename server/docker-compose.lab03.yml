services:
  postgres:
    image: postgres:16-alpine
    container_name: toktickit-lab03-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit
      POSTGRES_DB: toktickit
    ports:
      - "5433:5432"
    volumes:
      - toktickit_lab03_pgdata:/var/lib/postgresql/data
volumes:
  toktickit_lab03_pgdata:
